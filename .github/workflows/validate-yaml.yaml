name: yaml-lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:

  yaml-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install yamllint -y

      - name: run yamllint
        env:
          BASE: ${{ github.event.before || 'HEAD^1' }}
        run: |
          git diff --name-only --diff-filter=d "$BASE" HEAD -- '*.yaml' '*.yml' | xargs -r yamllint -c .yamllint

