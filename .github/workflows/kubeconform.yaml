name: kubeconform

on:
  workflow_call:

jobs:
  manifest-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: yokawasa/action-setup-kube-tools@v0.11.2
        with:
          kubeconform: '0.7.0'

      - name: Identify changed manifests
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --name-only --diff-filter=d "$BASE" HEAD -- '*.yaml' > changed-manifests.txt
          cat changed-manifests.txt

      - name: Run Kubeconform
        shell: bash
        run: |
          mapfile -t MANIFESTS < changed-manifests.txt

          if (( ${#MANIFESTS[@]} == 0 )); then
            echo "No changed manifests to validate."
            exit 0
          fi

          kubeconform \
            -summary \
            -ignore-missing-schemas \
            "${MANIFESTS[@]}"
