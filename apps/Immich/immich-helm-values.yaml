controllers:
  main:
    containers:
      main:
        image:
          tag: v3.2.0
        env:
          DB_HOSTNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: host
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: user
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: password
          DB_DATABASE_NAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: dbname

immich:
  persistence:
    library:
      existingClaim: nas-immich-pvc

valkey:
  enabled: true

machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            pullPolicy: IfNotPresent
          env:
            TRANSFORMERS_CACHE: /cache
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
          resources:
            requests:
              cpu: 2500m
              memory: 3Gi
            limits:
              cpu: "3"
              memory: 5Gi
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn

server:
  controllers:
    main:
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1001
          fsGroup: 1001
      containers:
        main:
          resources:
            requests:
              cpu: 2500m
              memory: 4608Mi
            limits:
              cpu: "3"
              memory: 5Gi
  ingress:
    main:
      enabled: false
