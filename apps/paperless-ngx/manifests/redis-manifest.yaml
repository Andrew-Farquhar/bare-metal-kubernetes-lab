apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: pngx-redis
    app: redis
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: pngx-redis
          image: docker.io/valkey/valkey:9-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
