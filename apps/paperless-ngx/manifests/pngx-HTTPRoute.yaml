apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pngx
  namespace: apps
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - pngx.home
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: paperless-ngx
          port: 8000
