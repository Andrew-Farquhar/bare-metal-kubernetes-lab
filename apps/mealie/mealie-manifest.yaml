apiVersion: v1
kind: Namespace
metadata: 
  name: apps
  labels:
    name: apps

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: mealie-config
  namespace: apps
data:
  TZ: "Europe/London"
  BASE_URL: "http://mealie.home"
  ALLOW_SIGNUP: "false"
  TOKEN_TIME: "48"

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: apps
  name: mealie-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: apps
  labels:
    app: mealie
    app.kubernetes.io/name: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
        app.kubernetes.io/name: mealie
    spec:
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-data
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: mealie-data
              mountPath: /app/data/
          envFrom:
            - configMapRef:
                name: mealie-config
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5

---

kind: Service
apiVersion: v1
metadata:
  name: mealie-service
  namespace: apps
spec:
  selector:
    app: mealie
  ports:
  - protocol: TCP
    port: 9000
    targetPort: 9000
  type: ClusterIP

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mealie
  namespace: apps
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames: 
    - mealie.home
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs: 
        - name: mealie-service
          port: 9000
