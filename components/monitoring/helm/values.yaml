crds:
  enabled: true
  upgradeJob:
    enabled: true

grafana:
  persistence:
    enabled: true
    type: pvc
    existingClaim: grafana

prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
