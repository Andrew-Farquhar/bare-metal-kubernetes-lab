service:
  annotations:
    metallb.io/loadBalancerIPs: "192.168.1.241"
  spec:    
    type: LoadBalancer


ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`dashboard.localhost`)
    entryPoints:
      - web

providers:
  kubernetesGateway:
    enabled: true

gateway:
  listeners:
    web:
      namespacePolicy:
        from: All
